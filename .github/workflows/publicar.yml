name: Publicar vehículos en Meta

on:
  # GitHub Actions usa hora UTC. Cada 10 minutos.
  schedule:
    - cron: '*/10 * * * *'
  # Permite el botón "Publicar ahora" desde la app.
  workflow_dispatch:
    inputs:
      publicacionId:
        description: 'ID de la publicación a enviar (vacío = toda la cola pendiente)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publicar en Facebook e Instagram
        run: node scripts/publicar.js
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLICACION_ID: ${{ github.event.inputs.publicacionId || '' }}

      - name: Guardar estados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/crm.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estados de publicaciones"
            git push
          fi
